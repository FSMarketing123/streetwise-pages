<html lang="en">
<head>
<meta charset="utf-8">

  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">

    <rect x="60" y="200" width="180" height="14" rx="7" fill="#C6D83B"/>
    <g fill="#FCFBF9" stroke="#D9DCDB">
      <rect x="60" y="270" width="330" height="420" rx="18"/>

</template>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --paper:      #FFFFFF;
  --card:       #FCFBF9;
  --ink:        #14161A;
  --ink-soft:   #6A6F78;
  --ink-faint:  #9EA3AB;
  --rule:       #DBD5CA;
  --accent:     #A8231F;
  --accent-ink: #7C1A16;
  --navy:       #1F3A5F;
  --warn:       #B4762A;

  --fs-paper:     #F7F8F7;
  --fs-card:      #FFFFFF;
  --fs-border:    #D9DCDB;
  --fs-ink:       #3F4443;
  --fs-ink-soft:  #6B7170;
  --fs-ink-faint: #9AA19F;
  --fs-blue:      #005670;
  --fs-teal:      #00939D;
  --fs-navy:      #003349;
  --fs-green:     #C6D83B;
  --fs-green-ink: #404715;
  --fs-shadow-sm: 0 2px 10px -2px rgba(0,51,73,.12);
  --fs-shadow-md: 0 16px 34px -12px rgba(0,51,73,.24);
  --fs-radius:    14px;
  --fs-radius-sm: 8px;
  --fs-font:      Arial, Helvetica, sans-serif;

  --f-display: 'Bodoni Moda', Georgia, serif;
  --f-ui:      'Archivo', system-ui, sans-serif;
  --f-mono:    'JetBrains Mono', ui-monospace, monospace;

  --gut: clamp(20px, 4vw, 56px);
  --maxw: 1340px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--f-ui); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.03; background:#9AA19F;
}
.wrap{position:relative; z-index:1; max-width:var(--maxw); margin:0 auto; padding:0 var(--gut)}
img{display:block; max-width:100%}
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
input{font:inherit}

.controls{
  position:sticky; top:0; z-index:30;
  background:color-mix(in srgb, var(--fs-paper) 90%, transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--fs-border);
  padding:20px 0 18px; margin-bottom:clamp(32px,5vh,56px);
  font-family:var(--fs-font);
}
.searchrow{display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.search{
  flex:1 1 300px; display:flex; align-items:center; gap:11px;
  border-bottom:1.5px solid var(--fs-border); padding:0 2px 9px;
  transition:border-color .2s;
}
.search:focus-within{border-color:var(--fs-teal)}
.search svg{flex:0 0 auto; color:var(--fs-teal)}
.search input{border:none; background:none; outline:none; width:100%; font-size:16px; font-family:var(--fs-font); color:var(--fs-ink); letter-spacing:-.005em}
.search input::placeholder{color:var(--fs-ink-faint)}
.kbd{
  font-family:var(--fs-font); font-size:10px; color:var(--fs-ink-faint);
  border:1px solid var(--fs-border); border-radius:4px; padding:2px 7px; flex:0 0 auto;
}
.count{font-family:var(--fs-font); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--fs-ink-soft); white-space:nowrap}
.count b{color:var(--fs-teal); font-weight:700}

.filters{display:flex; flex-direction:column; gap:10px; margin-top:16px}
.frow{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
.flabel{
  font-family:var(--fs-font); font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--fs-ink-faint); width:76px; flex:0 0 auto; padding-top:5px;
}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{
  font-family:var(--fs-font); font-size:12.5px; font-weight:600; letter-spacing:.01em;
  padding:6px 14px; border:1px solid var(--fs-border); border-radius:100px;
  color:var(--fs-ink-soft); background:var(--fs-card);
  transition:border-color .18s, color .18s, background .18s, box-shadow .18s;
}
.chip:hover{border-color:var(--fs-teal); color:var(--fs-blue); box-shadow:0 0 0 3px rgba(0,147,157,.12)}
.chip[aria-pressed="true"]{background:var(--fs-blue); border-color:var(--fs-blue); color:#fff}
.chip.reset{border-style:dashed; color:var(--fs-blue); border-color:color-mix(in srgb,var(--fs-blue) 40%,transparent); background:transparent}

.section{margin-bottom:clamp(46px,7vh,84px); font-family:var(--fs-font)}
.section[hidden]{display:none}
.shead{
  display:flex; align-items:baseline; gap:16px;
  border-bottom:2px solid var(--fs-blue); padding-bottom:12px; margin-bottom:28px;
}
.snum{font-family:var(--fs-font); font-weight:700; font-size:12px; color:var(--fs-teal); letter-spacing:.12em; padding-top:5px}
.shead h2{
  font-family:var(--fs-font); font-weight:700; font-size:clamp(20px,2.6vw,28px);
  letter-spacing:.04em; text-transform:uppercase; line-height:1; color:var(--fs-blue);
}
.stally{margin-left:auto; font-family:var(--fs-font); font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--fs-ink-faint); padding-top:5px}

.grid{
  display:grid; gap:clamp(20px,2.4vw,28px);
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
}

.card{
  display:flex; flex-direction:column; background:var(--fs-card);
  border:1px solid var(--fs-border); border-radius:var(--fs-radius); overflow:hidden; position:relative;
  box-shadow:var(--fs-shadow-sm);
  transition:transform .28s cubic-bezier(.22,1,.36,1), box-shadow .28s, border-color .28s;
  animation:rise .5s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
.card:hover{transform:translateY(-3px); border-color:var(--fs-teal); box-shadow:var(--fs-shadow-md)}
.card.nolink{background:var(--fs-paper); border-style:dashed; border-color:color-mix(in srgb,var(--fs-ink-faint) 55%,var(--fs-border)); box-shadow:none}
.card.nolink:hover{transform:none; box-shadow:none}

.thumb{position:relative; aspect-ratio:4/3; overflow:hidden; background:transparent; display:flex; align-items:center; justify-content:center; padding:14px}
.thumb img{
  width:100%; height:100%; object-fit:contain; object-position:center;
  filter:drop-shadow(0 6px 14px rgba(0,51,73,.18));
  transition:transform .55s cubic-bezier(.22,1,.36,1), filter .3s;
}
.card:hover .thumb img{transform:scale(1.03)}
.card.nolink .thumb img{filter:grayscale(1) opacity(.4)}

.tag{
  position:absolute; top:10px; left:10px;
  font-family:var(--fs-font); font-weight:700; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  background:var(--fs-navy); color:#fff; padding:5px 10px; border-radius:var(--fs-radius-sm);
}
.tag.warn{background:var(--fs-ink-soft)}
.star{
  position:absolute; top:10px; right:10px; color:var(--fs-green-ink); font-size:10px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; background:var(--fs-green); padding:4px 9px 3px;
  border-radius:var(--fs-radius-sm); line-height:1.4;
}
.tierbadge{
  position:absolute; top:10px; right:10px; color:var(--fs-green-ink); font-size:9.5px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase; background:var(--fs-green); padding:5px 10px;
  border-radius:var(--fs-radius-sm); line-height:1.4;
}

.body{padding:16px 17px 18px; display:flex; flex-direction:column; flex:1; gap:9px; font-family:var(--fs-font)}
.body h3{font-size:15px; font-weight:700; line-height:1.3; letter-spacing:-.005em; color:var(--fs-ink)}
.meta{
  font-family:var(--fs-font); font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  color:var(--fs-ink-faint); display:flex; gap:7px; flex-wrap:wrap;
}
.meta span:not(:last-child)::after{content:' ·'; color:var(--fs-border)}
.go{
  margin-top:auto; padding-top:12px; border-top:1px solid var(--fs-border);
  display:flex; align-items:center; justify-content:space-between;
  font-family:var(--fs-font); font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--fs-teal); transition:color .2s;
}
.card:hover .go{color:var(--fs-blue)}
.go .arw{transition:transform .28s cubic-bezier(.22,1,.36,1)}
.card:hover .go .arw{transform:translateX(5px)}
.go.dead{color:var(--fs-ink-faint)}
.card.nolink:hover .go.dead{color:var(--fs-ink-faint)}

.empty{
  text-align:center; padding:clamp(60px,12vh,120px) 20px;
  border:1px dashed var(--fs-border); border-radius:var(--fs-radius); font-family:var(--fs-font);
}
.empty p{font-weight:700; font-size:20px; letter-spacing:.03em; text-transform:uppercase; color:var(--fs-blue); margin-bottom:8px}
.empty small{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--fs-ink-faint)}

footer{background:var(--ink); color:rgba(255,255,255,.62); margin-top:clamp(50px,9vh,110px); padding:44px 0 38px}
.fin{max-width:var(--maxw); margin:0 auto; padding:0 var(--gut); display:flex; align-items:center; gap:30px; flex-wrap:wrap}
footer img{height:22px; width:auto}
footer .fnav{display:flex; gap:22px; margin-left:auto; flex-wrap:wrap}
footer .fnav a{font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; transition:color .2s}
footer .fnav a:hover{color:#fff}
footer small{font-family:var(--f-mono); font-size:10px; letter-spacing:.1em; width:100%; color:rgba(255,255,255,.34); margin-top:6px}

@media (max-width:700px){
  .flabel{width:100%}
  .controls{top:0}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px}
  .kbd{display:none}
  .shead h2{letter-spacing:.02em}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

/* ── Sideways-scrolling rows: page height stays fixed as packages are added ── */
.grid{
  display:grid; grid-template-columns:none; grid-auto-flow:column;
  grid-auto-columns:clamp(200px,22vw,250px);
  overflow-x:auto; overscroll-behavior-x:contain; scroll-snap-type:x proximity;
  padding:6px 2px 16px; scrollbar-width:thin; scrollbar-color:var(--fs-border) transparent;
}
.grid > .card{scroll-snap-align:start}
.snav{display:flex; gap:6px; padding-top:2px}
.sbtn{
  width:30px; height:30px; border-radius:50%; border:1px solid var(--fs-border); background:var(--fs-card);
  color:var(--fs-blue); font-size:14px; line-height:1; display:grid; place-items:center;
  transition:border-color .18s, background .18s, color .18s;
}
.sbtn:hover{border-color:var(--fs-teal); background:var(--fs-blue); color:#fff}
.sbtn:disabled{opacity:.35; pointer-events:none}
@media (max-width:700px){ .grid{grid-auto-columns:62vw; grid-template-columns:none} .snav{display:none} }
</style>
</head>
<body>

<div class="controls">
  <div class="wrap">
    <div class="searchrow">
      <label class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.5-4.5"/></svg>
        <input id="q" type="search" placeholder="Search collateral — property, market, asset type…" autocomplete="off">
        <span class="kbd">/</span>
      </label>
    </div>
    <div class="filters" id="filters"></div>
  </div>
</div>

<main class="wrap" id="results"></main>


<script>
/* ╔══════════════════════════════════════════════════════════════════╗
   ║  ADD CONTENT HERE — this is the only block that changes.         ║
   ║                                                                  ║
   ║  Fields: t (title) · s (section) · type (RFP/Package/BOV/       ║
   ║  Template/Deck/Flyer) · prop (Retail/Office/Industrial/Mixed)    ║
   ║  · mkt (market, optional) · url · img · tier (1/2/3, optional)   ║
   ║                                                                  ║
   ║  9 of the 16 links you sent don't expose a readable title yet    ║
   ║  (Publuu didn't set one) — they're included below labeled        ║
   ║  "Leasing Collateral — untitled" with a Rename flag. Swap in     ║
   ║  the real title whenever you have it; nothing else changes.      ║
   ╚══════════════════════════════════════════════════════════════════╝ */


let ITEMS = [];

/* ══════════ nothing below here needs editing ══════════ */

const SECTIONS = ["Proposal & Package","Template"];
const SECTION_FOR = {Proposal:"Proposal & Package", Package:"Proposal & Package", Template:"Template"};
const state = {q:"", type:"All", prop:"All", tier:"All"};
const uniq  = k => ["All", ...[...new Set(ITEMS.map(i=>i[k]).filter(Boolean))].sort()];
const uniqTier = () => ["All", ...[...new Set(ITEMS.map(i=>i.tier).filter(Boolean))].sort((a,b)=>a-b).map(t=>`Tier ${t}`)];
const esc   = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function buildFilters(){
  const rows = [["Type","type",uniq("type")],["Tier","tier",uniqTier()]];
  document.getElementById("filters").innerHTML = rows.map(([label,key,vals]) => `
    <div class="frow">
      <span class="flabel">${label}</span>
      <div class="chips">${vals.map(v =>
        `<button class="chip" data-k="${key}" data-v="${esc(v)}" aria-pressed="${state[key]===v}">${esc(v)}</button>`
      ).join("")}</div>
    </div>`).join("") + `
    <div class="frow"><span class="flabel"></span>
      <div class="chips"><button class="chip reset" id="reset">Clear all</button></div>
    </div>`;
}

const match = i => {
  if(state.type !== "All" && i.type !== state.type) return false;
  if(state.prop !== "All" && i.prop !== state.prop) return false;
  if(state.tier !== "All" && `Tier ${i.tier}` !== state.tier) return false;
  if(!state.q) return true;
  return [i.t,i.type,i.prop,i.mkt,i.s].join(" ").toLowerCase().includes(state.q);
};

function card(i, n){
  const dead = !i.url;
  return `
  <${dead ? "div" : "a"} class="card${dead?" nolink":""}"${dead?"":` href="${esc(i.url)}" target="_blank" rel="noopener"`}
     style="animation-delay:${Math.min(n,14)*35}ms">
    <div class="thumb">
      <img src="${esc(i.img)}" alt="${esc(i.t)} cover" loading="lazy">
      <span class="tag${dead?" warn":""}">${dead ? "Link needed" : esc(i.type)}</span>
      ${i.star && !dead ? '<span class="star" title="Featured">★</span>' : ""}
      ${i.tier && !dead ? `<span class="tierbadge">Tier ${esc(i.tier)}</span>` : ""}
    </div>
    <div class="body">
      <h3>${esc(i.t)}</h3>
      <p class="meta">
        <span>${esc(i.type)}</span>${i.prop ? `<span>${esc(i.prop)}</span>` : ""}${i.mkt ? `<span>${esc(i.mkt)}</span>` : ""}
      </p>
      ${i.des ? `<p style="font-family:var(--fs-font); font-size:10px; color:var(--fs-ink-soft)">Designed by ${esc(i.des)}</p>` : ""}
      <p class="go${dead?" dead":""}">${dead ? "Awaiting file" : "View PDF"}<span class="arw">${dead ? "—" : "→"}</span></p>
    </div>
  </${dead ? "div" : "a"}>`;
}

function render(){
  const hits = ITEMS.filter(match);

  if(!hits.length){
    document.getElementById("results").innerHTML =
      `<div class="empty"><p>Nothing matches.</p><small>Try clearing a filter</small></div>`;
    return;
  }
  let n = 0;
  document.getElementById("results").innerHTML = SECTIONS.map((s) => {
    const rows = hits.filter(i=>SECTION_FOR[i.type]===s);
    if(!rows.length) return "";
    return `<section class="section">
      <div class="shead">
        <h2>${esc(s)}</h2>
        <span class="stally">${rows.length} item${rows.length>1?"s":""}</span><span class="snav"><button class="sbtn" data-dir="-1" aria-label="Scroll left">&larr;</button><button class="sbtn" data-dir="1" aria-label="Scroll right">&rarr;</button></span>
      </div>
      <div class="grid">${rows.map(i=>card(i,n++)).join("")}</div>
    </section>`;
  }).join("");
}

document.getElementById("q").addEventListener("input", e => {
  state.q = e.target.value.trim().toLowerCase(); render();
});
document.getElementById("filters").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if(!c) return;
  if(c.id === "reset"){ state.type = state.prop = state.tier = "All"; state.q = ""; document.getElementById("q").value = ""; }
  else { state[c.dataset.k] = c.dataset.v; }
  buildFilters(); render();
});
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement.id !== "q"){ e.preventDefault(); document.getElementById("q").focus(); }
  if(e.key === "Escape" && document.activeElement.id === "q"){ document.getElementById("q").blur(); }
});

/* ---- sideways row arrows ---- */
function syncArrows(){
  document.querySelectorAll(".section").forEach(sec => {
    const g = sec.querySelector(".grid"), [l, r] = sec.querySelectorAll(".sbtn");
    if(!g || !l) return;
    l.disabled = g.scrollLeft < 4;
    r.disabled = g.scrollLeft + g.clientWidth >= g.scrollWidth - 4;
  });
}
document.getElementById("results").addEventListener("click", e => {
  const b = e.target.closest(".sbtn"); if(!b) return;
  const g = b.closest(".section").querySelector(".grid");
  g.scrollBy({left: Number(b.dataset.dir) * g.clientWidth * 0.85, behavior: "smooth"});
});
document.getElementById("results").addEventListener("scroll", syncArrows, true);
new MutationObserver(syncArrows).observe(document.getElementById("results"), {childList: true});
window.addEventListener("resize", syncArrows);

/* ---- packages live in items.json (edit that file, not this page) ---- */
fetch("items.json", {cache: "no-cache"})
  .then(r => r.json())
  .then(data => { ITEMS = data; buildFilters(); render(); })
  .catch(() => {
    document.getElementById("results").innerHTML =
      `<div class="empty"><p>Couldn't load packages.</p><small>Refresh the page to try again</small></div>`;
  });
</script>
</body>
</html>
